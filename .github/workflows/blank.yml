name: Encrypted Variable Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Access Secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is not available"
            exit 1
          fi
